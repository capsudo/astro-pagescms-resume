name: Build generated content

on:
  push:
    paths:
      - "src/content/**"
      - "scripts/**"
      - ".pages.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

jobs:
  build-generated-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout resume repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate markdown files
        run: npm run generate:markdown

      - name: Generate blog about-page data
        run: npm run generate:blog-data

      - name: Upload generated content
        uses: actions/upload-artifact@v4
        with:
          name: generated-content
          path: generated
