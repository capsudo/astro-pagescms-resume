media:
  input: public/media
  output: /media

components:
  technology:
    type: object
    label: Technology
    fields:
      - name: name
        type: string
        required: true
      - name: slug
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"
      - name: iconUrl
        label: Icon URL
        type: image
      - name: twitterUsername
        label: Twitter username
        type: string
      - name: githubUsername
        label: GitHub username
        type: string
      - name: redditUsername
        label: Reddit username
        type: string
      - name: githubProjectUrl
        label: GitHub project URL
        type: string
      - name: sortOrder
        label: Sort order
        type: number

content:
  - name: identity
    label: Identity
    type: file
    path: src/content/identity.json
    format: json
    fields:
      - name: name
        type: string
        required: true
      - name: headline
        type: string
        required: true
      - name: shortDescription
        label: Short description
        type: text
        required: true
      - name: longDescription
        label: Long description
        type: text
        required: true
      - name: email
        type: string
      - name: phone
        type: string
      - name: location
        type: string
      - name: availability
        type: string
      - name: profileImageUrl
        label: Profile image URL
        type: image

  - name: social
    label: Social usernames
    type: file
    path: src/content/social.json
    format: json
    fields:
      - name: githubUsername
        label: GitHub username
        type: string
      - name: redditUsername
        label: Reddit username
        type: string
      - name: twitterUsername
        label: Twitter username
        type: string

  - name: frameworks
    label: Frameworks
    type: collection
    path: src/content/frameworks
    format: json
    filename: "{fields.technology.slug}.json"
    view:
      fields: [technology.name, technology.slug, technology.githubProjectUrl]
      primary: technology.name
      sort: [technology.sortOrder, technology.name]
      search: [technology.name, technology.slug]
      default:
        sort: technology.sortOrder
        order: asc
    fields:
      - name: technology
        component: technology

  - name: languages
    label: Languages
    type: collection
    path: src/content/languages
    format: json
    filename: "{fields.technology.slug}.json"
    view:
      fields: [technology.name, technology.slug, technology.githubProjectUrl]
      primary: technology.name
      sort: [technology.sortOrder, technology.name]
      search: [technology.name, technology.slug]
      default:
        sort: technology.sortOrder
        order: asc
    fields:
      - name: technology
        component: technology

  - name: stack
    label: Stack
    type: collection
    path: src/content/stack
    format: json
    filename: "{fields.technology.slug}.json"
    view:
      fields: [technology.name, technology.slug, technology.githubProjectUrl]
      primary: technology.name
      sort: [technology.sortOrder, technology.name]
      search: [technology.name, technology.slug]
      default:
        sort: technology.sortOrder
        order: asc
    fields:
      - name: technology
        component: technology

  - name: projects
    label: Projects
    type: collection
    path: src/content/projects
    format: json
    filename: "{slug}.json"
    view:
      primary: name
      sort: sortOrder
    fields:
      - name: name
        type: string
        required: true
      - name: slug
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"
      - name: periodStartDate
        label: Period start date
        type: date
      - name: periodEndDate
        label: Period end date
        type: date
      - name: company
        type: string
      - name: description
        type: text
      - name: languageSlugs
        label: Languages
        type: reference
        options:
          collection: languages
          multiple: true
          search: "fields.technology.name,fields.technology.slug"
          value: "{fields.technology.slug}"
          label: "{fields.technology.name}"
      - name: frameworkSlugs
        label: Frameworks
        type: reference
        options:
          collection: frameworks
          multiple: true
          search: "fields.technology.name,fields.technology.slug"
          value: "{fields.technology.slug}"
          label: "{fields.technology.name}"
      - name: stackSlugs
        label: Stack
        type: reference
        options:
          collection: stack
          multiple: true
          search: "fields.technology.name,fields.technology.slug"
          value: "{fields.technology.slug}"
          label: "{fields.technology.name}"
      - name: projectUrl
        label: Project URL
        type: string
      - name: featured
        type: boolean
      - name: sortOrder
        label: Sort order
        type: number

  - name: experiences
    label: Experiences
    type: collection
    path: src/content/experiences
    format: json
    filename: "{slug}.json"
    view:
      primary: name
      sort: sortOrder
    fields:
      - name: name
        type: string
        required: true
      - name: slug
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"
      - name: location
        type: string
      - name: periodStartDate
        label: Period start date
        type: date
      - name: periodEndDate
        label: Period end date
        type: date
      - name: company
        type: string
      - name: description
        type: text
      - name: sortOrder
        label: Sort order
        type: number
